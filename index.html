  <body>
    <div id="root"></div>

    <!-- Guest Tracker & WhatsApp RSVP Dynamic Integration -->
    <script>
      (function() {
        const dataRsvp = (window.WEDDING_DATA && window.WEDDING_DATA.rsvp) || {};
        const RSVP_PHONE = dataRsvp.whatsappClean || "919173075928";
        const RSVP_PHONE_DISPLAY = dataRsvp.phone || "+91 91730 75928";

        function getGuestParam() {
          try {
            const urlParams = new URLSearchParams(window.location.search);
            return (urlParams.get('guest') || urlParams.get('to') || urlParams.get('name') || urlParams.get('invitee') || '').trim();
          } catch (e) {
            return '';
          }
        }

        function createGuestTrackerHtml(guestName) {
          const hasGuest = Boolean(guestName);
          const data = window.WEDDING_DATA || {};
          const wedding = data.wedding || {};
          const sangeeth = wedding.sangeeth || {};

          const sDate = sangeeth.dateLabel || '19th December 2026, Saturday';
          const sTime = sangeeth.time || 'From 5:00 PM onwards';
          const sVenue = sangeeth.venue || 'Arabian Beach Resort';

          const wDate = wedding.dateLabel || '20th December 2026, Sunday';
          const wTime = wedding.muhurthamLabel || wedding.timeLabel || 'Muhurtham 10:30 - 11:30 AM';
          const wVenue = (data.venue && data.venue.name) || 'CR Auditorium, Eachur';

          return `
            <div class="pointer-events-none absolute inset-0 opacity-20" style="background-image:url('external/media.invitestory.in/kerala-sands/images/mandala-texture.jpg');background-size:130%;background-position:center;"></div>
            <img src="external/media.invitestory.in/kerala-sands/images/floral-corner.png" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute -top-4 -left-8 w-36 opacity-30">
            <img src="external/media.invitestory.in/kerala-sands/images/floral-corner.png" alt="" aria-hidden="true" loading="lazy" class="pointer-events-none absolute -right-8 -bottom-4 w-36 rotate-180 opacity-30">
            
            <div class="gt-card">
              <div class="gt-badge">Guest Tracker & RSVP</div>
              <h2 class="gt-title">Celebrate With Us</h2>
              <p class="gt-subtitle">We would be honored by your presence at our wedding celebrations</p>

              <!-- Events Overview: Sangeeth Night & Wedding Ceremony -->
              <div class="gt-events-banner">
                <div class="gt-event-card">
                  <div class="gt-event-card-tag"><span>🪩</span> Day 1 · Sangeeth</div>
                  <div class="gt-event-card-name">Sangeeth Night</div>
                  <div class="gt-event-card-date">${sDate}</div>
                  <div class="gt-event-card-venue">${sTime} · ${sVenue}</div>
                </div>
                <div class="gt-event-card">
                  <div class="gt-event-card-tag"><span>🌸</span> Day 2 · Muhurtham</div>
                  <div class="gt-event-card-name">Wedding Ceremony</div>
                  <div class="gt-event-card-date">${wDate}</div>
                  <div class="gt-event-card-venue">${wTime} · ${wVenue}</div>
                </div>
              </div>

              ${hasGuest ? `
              <div class="gt-vip-banner">
                <div class="gt-vip-tag">✦ Guest of Honour ✦</div>
                <div class="gt-vip-name">${escapeHtml(guestName)}</div>
                <div class="gt-vip-desc">Dr. Anusri & Vishal warmly invite you to grace their wedding celebrations.</div>
              </div>` : ''}

              <!-- Attendance Choice -->
              <div class="gt-form-group">
                <label class="gt-label">Will you be attending?</label>
                <div class="gt-attendance-row">
                  <button type="button" class="gt-pill-btn active" data-attending="yes">
                    <span>✨</span> Happily Joining
                  </button>
                  <button type="button" class="gt-pill-btn" data-attending="no">
                    <span>🤍</span> Regretfully Decline
                  </button>
                </div>
              </div>

              <!-- Celebration Event Selection -->
              <div class="gt-form-group" id="gt-event-choice-group">
                <label class="gt-label">Which celebration(s) will you attend?</label>
                <div class="gt-event-choices">
                  <button type="button" class="gt-event-choice-btn active" data-choice="both">
                    <span class="gt-choice-icon">✨</span>
                    <div class="gt-choice-body">
                      <div class="gt-choice-title">Both Celebrations</div>
                      <div class="gt-choice-meta">Sangeeth Night (19 Dec) &amp; Wedding Ceremony (20 Dec)</div>
                    </div>
                    <div class="gt-choice-radio"><span class="gt-choice-radio-dot"></span></div>
                  </button>
                  <button type="button" class="gt-event-choice-btn" data-choice="sangeeth">
                    <span class="gt-choice-icon">🪩</span>
                    <div class="gt-choice-body">
                      <div class="gt-choice-title">Sangeeth Night Only</div>
                      <div class="gt-choice-meta">19th Dec 2026, Sat · From 5:00 PM (${sVenue})</div>
                    </div>
                    <div class="gt-choice-radio"><span class="gt-choice-radio-dot"></span></div>
                  </button>
                  <button type="button" class="gt-event-choice-btn" data-choice="wedding">
                    <span class="gt-choice-icon">🌸</span>
                    <div class="gt-choice-body">
                      <div class="gt-choice-title">Wedding Ceremony Only</div>
                      <div class="gt-choice-meta">20th Dec 2026, Sun · Muhurtham 10:30 AM (${wVenue})</div>
                    </div>
                    <div class="gt-choice-radio"><span class="gt-choice-radio-dot"></span></div>
                  </button>
                </div>
              </div>

              <!-- Guest Name Field -->
              <div class="gt-form-group">
                <label class="gt-label" for="gt-input-name">Your Full Name</label>
                <input id="gt-input-name" class="gt-input" type="text" placeholder="e.g. Dr. Rahul Sharma" value="${escapeHtml(guestName)}" autocomplete="name" />
              </div>

              <!-- Guest Count -->
              <div class="gt-form-group" id="gt-count-group">
                <label class="gt-label">Number of Guests</label>
                <div class="gt-counts-row">
                  <button type="button" class="gt-count-btn" data-count="1">1</button>
                  <button type="button" class="gt-count-btn active" data-count="2">2</button>
                  <button type="button" class="gt-count-btn" data-count="3">3</button>
                  <button type="button" class="gt-count-btn" data-count="4">4</button>
                  <button type="button" class="gt-count-btn" data-count="5+">5+</button>
                </div>
              </div>

              <!-- Message / Wishes -->
              <div class="gt-form-group">
                <label class="gt-label" for="gt-input-msg">Message / Blessing (Optional)</label>
                <textarea id="gt-input-msg" class="gt-textarea" rows="2" placeholder="Send your heartfelt wishes to the couple..."></textarea>
              </div>

              <!-- WhatsApp Action Button -->
              <button type="button" id="gt-submit-btn" class="gt-submit-btn">
                <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24">
                  <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                </svg>
                Confirm RSVP via WhatsApp
              </button>

              <div id="gt-status-toast" class="gt-status-toast">
                ✓ Opening WhatsApp to send your RSVP...
              </div>

              <!-- Direct Chat WhatsApp Contact -->
              <a href="https://wa.me/${RSVP_PHONE}?text=${encodeURIComponent('Hello Vishal & Anusri, I would like to RSVP for your Sangeeth Night (19th Dec 2026) and Wedding Ceremony (20th Dec 2026).')}" target="_blank" rel="noreferrer" class="gt-direct-link">
                <span>💬</span> Direct WhatsApp RSVP: ${RSVP_PHONE_DISPLAY}
              </a>
            </div>
          `;
        }

        function escapeHtml(str) {
          if (!str) return '';
          return str.replace(/[&<>'"]/g, function(tag) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag);
          });
        }

        function initGuestTracker() {
          if (document.getElementById('guest-tracker-section')) return;

          const rootEl = document.getElementById('root');
          if (!rootEl) return;

          // Search for share section specifically inside root
          const sections = Array.from(rootEl.querySelectorAll('section'));
          const shareSection = sections.find(s => s.textContent && (s.textContent.includes('Share this invitation') || s.textContent.includes('Spread the joy')));

          // CRITICAL: ONLY insert if shareSection exists. Never prepend above hero!
          if (!shareSection || !shareSection.parentNode) return;

          const guestName = getGuestParam();
          const gtSection = document.createElement('section');
          gtSection.id = 'guest-tracker-section';
          gtSection.className = 'guest-tracker-section';
          gtSection.innerHTML = createGuestTrackerHtml(guestName);

          shareSection.parentNode.insertBefore(gtSection, shareSection);
          bindTrackerEvents(gtSection);
        }

        function bindTrackerEvents(container) {
          let isAttending = 'yes';
          let selectedChoice = 'both';
          let guestCount = '2';

          // Attendance toggle
          const attendBtns = container.querySelectorAll('.gt-pill-btn');
          const countGroup = container.querySelector('#gt-count-group');
          const eventChoiceGroup = container.querySelector('#gt-event-choice-group');

          attendBtns.forEach(btn => {
            btn.addEventListener('click', function() {
              attendBtns.forEach(b => b.classList.remove('active'));
              this.classList.add('active');
              isAttending = this.getAttribute('data-attending');
              if (countGroup) {
                countGroup.style.display = isAttending === 'no' ? 'none' : 'block';
              }
              if (eventChoiceGroup) {
                eventChoiceGroup.style.display = isAttending === 'no' ? 'none' : 'block';
              }
            });
          });

          // Celebration Event toggle
          const choiceBtns = container.querySelectorAll('.gt-event-choice-btn');
          choiceBtns.forEach(btn => {
            btn.addEventListener('click', function() {
              choiceBtns.forEach(b => b.classList.remove('active'));
              this.classList.add('active');
              selectedChoice = this.getAttribute('data-choice');
            });
          });

          // Guest count toggle
          const countBtns = container.querySelectorAll('.gt-count-btn');
          countBtns.forEach(btn => {
            btn.addEventListener('click', function() {
              countBtns.forEach(b => b.classList.remove('active'));
              this.classList.add('active');
              guestCount = this.getAttribute('data-count');
            });
          });

          // WhatsApp Submit Button
          const submitBtn = container.querySelector('#gt-submit-btn');
          const toast = container.querySelector('#gt-status-toast');

          if (submitBtn) {
            submitBtn.addEventListener('click', function() {
              const nameInput = container.querySelector('#gt-input-name');
              const msgInput = container.querySelector('#gt-input-msg');

              const name = (nameInput && nameInput.value ? nameInput.value.trim() : '') || 'Guest';
              const message = msgInput && msgInput.value ? msgInput.value.trim() : '';

              const data = window.WEDDING_DATA || {};
              const wedding = data.wedding || {};
              const sangeeth = wedding.sangeeth || {};

              const sDate = sangeeth.dateLabel || '19th December 2026, Saturday';
              const sVenue = sangeeth.venue || 'Arabian Beach Resort, Kannur';
              const sTime = sangeeth.time || 'From 5:00 PM';
              const wDate = wedding.dateLabel || '20th December 2026, Sunday';
              const wVenue = (data.venue && data.venue.name) || 'CR Auditorium, Eachur, Kannur';
              const wTime = wedding.muhurthamLabel || wedding.timeLabel || 'Muhurtham 10:30 - 11:30 AM';

              let rsvpText = '';
              if (isAttending === 'yes') {
                let attendingEventsText = '';
                if (selectedChoice === 'both') {
                  attendingEventsText = `• Attending: Both Celebrations ✨\n` +
                    `   1. Sangeeth Night: ${sDate} (${sTime}) at ${sVenue}\n` +
                    `   2. Wedding Ceremony: ${wDate} (${wTime}) at ${wVenue}\n`;
                } else if (selectedChoice === 'sangeeth') {
                  attendingEventsText = `• Attending: Sangeeth Night Only 🪩\n` +
                    `   Date: ${sDate} (${sTime})\n` +
                    `   Venue: ${sVenue}\n`;
                } else {
                  attendingEventsText = `• Attending: Wedding Ceremony Only 🌸\n` +
                    `   Date: ${wDate} (${wTime})\n` +
                    `   Venue: ${wVenue}\n`;
                }

                rsvpText = `Namaste! Wedding RSVP for Dr. Anusri & Vishal 🌸\n\n` +
                           `• Guest Name: ${name}\n` +
                           `• Status: Happily Joining ✨\n` +
                           attendingEventsText +
                           `• Number of Guests: ${guestCount}\n`;
              } else {
                rsvpText = `Namaste! Wedding RSVP for Dr. Anusri & Vishal 🌸\n\n` +
                           `• Guest Name: ${name}\n` +
                           `• Status: Regretfully Unable to Attend 🤍\n` +
                           `• Events: Sangeeth Night (${sDate}) & Wedding Ceremony (${wDate})\n`;
              }

              if (message) {
                rsvpText += `• Wishes: "${message}"\n`;
              }

              rsvpText += `\n📍 Celebrations:\n` +
                          `• 19 Dec 2026: Sangeeth Night · Arabian Beach Resort\n` +
                          `• 20 Dec 2026: Wedding Ceremony · CR Auditorium, Eachur`;

              const waUrl = `https://wa.me/${RSVP_PHONE}?text=${encodeURIComponent(rsvpText)}`;

              if (toast) {
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 4000);
              }

              window.open(waUrl, '_blank');
            });
          }
        }

        function downloadSangeethICS() {
          const data = window.WEDDING_DATA || {};
          const sangeeth = (data.wedding && data.wedding.sangeeth) || {};
          const sVenue = sangeeth.venue || 'Arabian Beach Resort';
          const sAddress = sangeeth.address || 'Kannur, Kerala';
          const sDate = sangeeth.dateISO || '2026-12-19T17:00:00+05:30';
          const eDate = sangeeth.endISO || '2026-12-19T23:00:00+05:30';

          function fmt(iso) {
            return new Date(iso).toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
          }

          const lines = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'PRODID:-//Wedding Invite//EN',
            'BEGIN:VEVENT',
            `UID:${Date.now()}@sangeeth`,
            `DTSTAMP:${fmt(new Date().toISOString())}`,
            `DTSTART:${fmt(sDate)}`,
            `DTEND:${fmt(eDate)}`,
            'SUMMARY:Dr. Anusri & Vishal — Sangeeth Night Celebration',
            `LOCATION:${sVenue}, ${sAddress}`,
            'DESCRIPTION:With rhythm in our hearts and joy in the air, we invite you to celebrate, sing, and dance the night away with us.',
            'END:VEVENT',
            'END:VCALENDAR'
          ].join('\r\n');

          const blob = new Blob([lines], { type: 'text/calendar;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'sangeeth-night.ics';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }

        function separateSangeethCard() {
          if (document.getElementById('sangeeth-map-card')) return;

          const data = window.WEDDING_DATA || {};
          const sangeeth = (data.wedding && data.wedding.sangeeth) || {};
          const sVenue = sangeeth.venue || 'Arabian Beach Resort';
          const sAddress = sangeeth.address || 'Palliyammoola, Payyambalam Beach Road, Kannur, Kerala - 670014';
          const sMapsUrl = sangeeth.mapsUrl || 'https://share.google/FoqulMfRQskuKidvH';
          const sMapImg = (data.images && data.images.sangeethMapPreview) || './editable/assets/sangeeth-map-preview.jpg';

          // Search for Sangeeth card inside #root
          const allElements = document.querySelectorAll('#root h2, #root p');
          let sangeethCard = null;
          for (const el of allElements) {
            if (el.textContent && (el.textContent.includes('Pre-wedding celebration') || el.textContent.includes('Sangeeth Night'))) {
              sangeethCard = el.closest('[class*="border-gold"]') || el.closest('[class*="bg-card"]');
              if (sangeethCard) break;
            }
          }

          if (!sangeethCard) return;

          // 1. Prominent written Date badge in Sangeeth header
          const headerWrap = sangeethCard.querySelector('.from-primary.to-emerald-ink') || sangeethCard.querySelector('[class*="bg-gradient-to-br"]');
          if (headerWrap && !headerWrap.querySelector('.sangeeth-date-pill')) {
            const datePill = document.createElement('div');
            datePill.className = 'sangeeth-date-pill';
            datePill.style.cssText = 'margin: 0.95rem auto 0.4rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; background: rgba(0,0,0,0.36); border: 1.5px solid rgba(220,185,80,0.55); border-radius: 9999px; padding: 0.45rem 1.3rem; color: #FCE38A; font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; font-family: "Cinzel", serif; box-shadow: 0 4px 14px rgba(0,0,0,0.25);';
            datePill.innerHTML = `<span>🗓️</span> ${sangeeth.dateLabel || '19th December 2026, Saturday'}`;
            const quoteEl = headerWrap.querySelector('.sangeeth-quote') || headerWrap.querySelector('p:last-child');
            if (quoteEl) {
              headerWrap.insertBefore(datePill, quoteEl);
            } else {
              headerWrap.appendChild(datePill);
            }
          }

          // 2. Add Event Date row into the details list
          const divideWrap = sangeethCard.querySelector('.divide-gold\\/15') || sangeethCard.querySelector('[class*="divide-y"]');
          if (divideWrap && !divideWrap.querySelector('.sangeeth-date-row')) {
            const dateRow = document.createElement('div');
            dateRow.className = 'flex items-center gap-4 px-6 py-4 sangeeth-date-row';
            dateRow.innerHTML = `
              <span class="bg-secondary text-primary grid h-10 w-10 shrink-0 place-items-center rounded-full">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </span>
              <div class="min-w-0">
                <p class="text-muted-foreground text-[0.6rem] tracking-[0.3em] uppercase">Event Date</p>
                <p class="text-foreground text-sm font-medium">${sangeeth.dateLabel || '19th December 2026, Saturday'}</p>
              </div>
            `;
            divideWrap.insertBefore(dateRow, divideWrap.firstChild);
          }

          // 3. Swap button in Sangeeth card to "Add to calendar"
          const btnWrap = sangeethCard.querySelector('.px-6.pt-2.pb-6') || sangeethCard.querySelector('div:last-child');
          if (btnWrap && !btnWrap.querySelector('#sangeeth-cal-btn')) {
            btnWrap.innerHTML = `
              <button type="button" id="sangeeth-cal-btn" class="from-primary to-emerald-ink text-ivory shadow-gold flex w-full items-center justify-center gap-2 rounded-full bg-gradient-to-r py-4 text-xs tracking-[0.3em] uppercase" style="cursor:pointer;border:none;">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                Add to calendar
              </button>
            `;
            const calBtn = btnWrap.querySelector('#sangeeth-cal-btn');
            if (calBtn) {
              calBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                downloadSangeethICS();
              });
            }
          }

          // 2. Insert separate Sangeeth map card directly below the Sangeeth celebration card
          const mapCard = document.createElement('div');
          mapCard.id = 'sangeeth-map-card';
          mapCard.className = 'border-gold/30 bg-card shadow-luxe mt-6 overflow-hidden rounded-[2rem] border';
          mapCard.innerHTML = `
            <div class="relative">
              <img src="${sMapImg}" alt="Map to ${sVenue}" loading="lazy" width="1024" height="768" class="h-48 w-full object-cover">
              <div class="from-card absolute inset-0 bg-gradient-to-t via-transparent to-transparent"></div>
            </div>
            <div class="px-6 pt-2 pb-6 text-center">
              <p class="text-primary text-xl font-medium">${sVenue}</p>
              <p class="text-muted-foreground mt-1 text-xs">${sAddress}</p>
              <a href="${sMapsUrl}" target="_blank" rel="noreferrer" class="border-gold/50 text-primary hover:bg-secondary mt-5 inline-flex items-center justify-center gap-2 rounded-full border px-7 py-3.5 text-xs tracking-[0.3em] uppercase transition-colors" style="text-decoration:none;">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                </svg>
                Get directions
              </a>
            </div>
          `;

          const animContainer = sangeethCard.parentElement && sangeethCard.parentElement.tagName.toLowerCase() === 'div' && sangeethCard.parentElement.parentElement && sangeethCard.parentElement.parentElement.tagName.toLowerCase() === 'div' ? sangeethCard.parentElement : sangeethCard;
          animContainer.parentNode.insertBefore(mapCard, animContainer.nextSibling);
        }

        // Run when DOM is ready and observe for React mount
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            initGuestTracker();
            separateSangeethCard();
          });
        } else {
          initGuestTracker();
          separateSangeethCard();
        }

        // MutationObserver to ensure insertion once React finishes rendering
        const observer = new MutationObserver(function() {
          if (!document.getElementById('guest-tracker-section')) {
            initGuestTracker();
          }
          if (!document.getElementById('sangeeth-map-card')) {
            separateSangeethCard();
          }
        });

        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>

    <!-- Background Music Audio & Luxury Floating Player Button -->
    <audio id="wedding-bg-audio" loop preload="auto" playsinline src="./editable/assets/bg-music.mp3"></audio>
    <button id="music-toggle-btn" class="music-player-btn paused" type="button" aria-label="Toggle background music" title="Toggle background music">
      <svg class="music-disc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="3"></circle>
        <line x1="12" y1="2" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22"></line>
      </svg>
      <span class="music-mute-slash"></span>
    </button>

    <script>
      (function() {
        const audio = document.getElementById('wedding-bg-audio');
        const btn = document.getElementById('music-toggle-btn');
        let isStarted = false;

        function updateBtnState() {
          if (!btn) return;
          if (audio && !audio.paused) {
            btn.classList.add('playing');
            btn.classList.remove('paused');
          } else {
            btn.classList.remove('playing');
            btn.classList.add('paused');
          }
        }

        function playAudio() {
          if (!audio) return;
          audio.play().then(() => {
            isStarted = true;
            updateBtnState();
            removeInteractionListeners();
          }).catch(() => {
            // Awaiting user gesture
          });
        }

        function toggleAudio(e) {
          if (e) {
            e.stopPropagation();
            e.preventDefault();
          }
          if (!audio) return;
          if (audio.paused) {
            audio.play().then(() => {
              isStarted = true;
              updateBtnState();
            }).catch(() => {});
          } else {
            audio.pause();
            updateBtnState();
          }
        }

        function onFirstGesture() {
          if (!isStarted) {
            playAudio();
          }
        }

        const events = ['click', 'touchstart', 'touchend', 'scroll', 'keydown'];
        function addInteractionListeners() {
          events.forEach(evt => window.addEventListener(evt, onFirstGesture, { passive: true, capture: true }));
        }
        function removeInteractionListeners() {
          events.forEach(evt => window.removeEventListener(evt, onFirstGesture, true));
        }

        if (btn) {
          btn.addEventListener('click', toggleAudio);
        }

        // Tapping the seal button on intro page starts audio immediately
        document.addEventListener('click', function(e) {
          const sealBtn = e.target && e.target.closest && (e.target.closest('button[aria-label="Open the invitation"]') || e.target.closest('.group.relative.mt-12') || e.target.closest('[class*="group relative"]'));
          if (sealBtn) {
            playAudio();
          }
        }, true);

        if (audio) {
          audio.addEventListener('play', updateBtnState);
          audio.addEventListener('pause', updateBtnState);
        }

        addInteractionListeners();
        updateBtnState();
        playAudio();
      })();
    </script>
  </body>
</html>
